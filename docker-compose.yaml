name: learnic

x-default: &default
  restart: unless-stopped
  init: true
  networks:
    - learnic-net

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  postgres:
    <<: *default
    image: postgres:16-alpine
    container_name: learnic-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

  migrate:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/healthcheck"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  caddy:
    <<: *default
    image: caddy:2-alpine
    container_name: learnic-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]

volumes:
  postgres-data:
    name: learnic-postgres-data
  caddy-data:
    name: learnic-caddy-data
  caddy-config:
    name: learnic-caddy-config

networks:
  learnic-net:
    driver: bridge
