name: learnic

x-default: &default
  restart: unless-stopped
  init: true
  networks:
    - learnic-net

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 15s

services:
  postgres:
    <<: *default
    image: postgres:16-alpine
    container_name: learnic-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

  migrate:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-app
    # Also on the shared edge network so the frontend `web` (a separate compose
    # project, co-located deploy) can reach it by container name (learnic-app).
    networks:
      - learnic-net
      - learnic-edge
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # gunicorn web-worker count — gunicorn reads WEB_CONCURRENCY natively.
      # Override in .env; defaults to 2 (fits the 512M limit below).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8000/healthcheck"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  worker:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-worker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    command: ["taskiq", "worker", "learnic.worker:broker", "--workers", "${TASKIQ_WORKERS:-2}"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *default
    build:
      context: .
      target: runtime
    container_name: learnic-scheduler
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    # Periodic scheduler — emits cron-labeled tasks (e.g.
    # reconcile_storage_quotas_task daily at 03:00 UTC) onto the
    # broker. Worker side consumes them. MUST be single-replica:
    # extra instances put the same tick into the queue N times.
    command: ["taskiq", "scheduler", "learnic.worker:scheduler"]
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    <<: *default
    # Custom build: stock Caddy + the caddy-ratelimit module (see deploy/caddy/Dockerfile).
    build:
      context: ./deploy/caddy
    container_name: learnic-caddy
    # Also on the shared edge network so that — in a co-located deploy — this
    # Caddy can reach the frontend `web` container (learnic-web) by name.
    networks:
      - learnic-net
      - learnic-edge
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      RATE_LIMIT_EVENTS: ${RATE_LIMIT_EVENTS:-200}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_EXEMPT_IPS: ${RATE_LIMIT_EXEMPT_IPS:-127.0.0.1/32}
      # Tighter API zones: auth endpoints + expensive FTS search (both Caddyfiles).
      AUTH_RATE_LIMIT_EVENTS: ${AUTH_RATE_LIMIT_EVENTS:-20}
      AUTH_RATE_LIMIT_WINDOW: ${AUTH_RATE_LIMIT_WINDOW:-1m}
      SEARCH_RATE_LIMIT_EVENTS: ${SEARCH_RATE_LIMIT_EVENTS:-60}
      SEARCH_RATE_LIMIT_WINDOW: ${SEARCH_RATE_LIMIT_WINDOW:-1m}
      # Per-user throttle on the learnic.ru block (co-located Caddyfile only).
      SITE_RATE_LIMIT_EVENTS: ${SITE_RATE_LIMIT_EVENTS:-300}
      SITE_RATE_LIMIT_WINDOW: ${SITE_RATE_LIMIT_WINDOW:-1m}
      # Tight auth-form-submit zone on the learnic.ru block (co-located only).
      SITE_AUTH_RATE_LIMIT_EVENTS: ${SITE_AUTH_RATE_LIMIT_EVENTS:-10}
      SITE_AUTH_RATE_LIMIT_WINDOW: ${SITE_AUTH_RATE_LIMIT_WINDOW:-1m}
    volumes:
      # Default = api-only (split deploy). Set BACKEND_CADDYFILE to
      # ./deploy/caddy/Caddyfile.colocated for a single-host deploy that fronts
      # both domains.
      - ${BACKEND_CADDYFILE:-./deploy/caddy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]

volumes:
  postgres-data:
    name: learnic-postgres-data
  caddy-data:
    name: learnic-caddy-data
  caddy-config:
    name: learnic-caddy-config

networks:
  learnic-net:
    driver: bridge
  # Shared external network spanning the backend and frontend compose projects.
  # Lets `web` ↔ `app` (and the co-located Caddy ↔ `learnic-web`) reach each
  # other by container name. Created once via `just _net` (or
  # `docker network create learnic-edge`). In a split deploy it just holds this
  # stack's edge-facing services.
  learnic-edge:
    external: true
    name: learnic-edge
