name: learnic-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnic-dev-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnic}
      POSTGRES_DB: ${POSTGRES_DB:-learnic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnic} -d ${POSTGRES_DB:-learnic}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: learnic-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-learnic}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-learnic_secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: learnic-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-learnic}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-learnic_secret}
      S3_BUCKET: ${S3_BUCKET:-learnic}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET
      "

volumes:
  postgres-data:
    name: learnic-dev-postgres-data
  minio-data:
    name: learnic-dev-minio-data
  redis-data:
    name: learnic-dev-redis-data
