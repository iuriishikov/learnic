[project]
name = "learnic"
version = "0.1.0"
description = ""
authors = [
    {name = "Iurii Shikov",email = "115935422+a55le@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.136.0,<0.137.0)",
    "pydantic (>=2.13.2,<3.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "dishka (>=1.6.0,<2.0.0)",
    "uvicorn[standard] (>=0.34.0,<1.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
    "orjson (>=3.10.0,<4.0.0)",
    "typing-extensions (>=4.12.0,<5.0.0)",
    "pydantic-settings (>=2.9,<3.0)",
    "gunicorn (>=25.3.0,<26.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "greenlet (>=3.4.0,<4.0.0)",
    "aioboto3 (>=13.0.0,<14.0.0)",
    "taskiq[reload] (>=0.12.2,<0.13.0)",
    "taskiq-redis (>=1.2.2,<2.0.0)",
    "argon2-cffi (>=23.1.0,<24.0.0)",
    "pyjwt (>=2.10.0,<3.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
    "codespell (>=2.4.2,<3.0.0)",
    "mypy (>=1.20.1,<2.0.0)",
    "bandit (>=1.9.4,<2.0.0)",
    "semgrep (>=1.159.0,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.poetry]
packages = [{include = "learnic", from = "src"}]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiobotocore.*", "aioboto3.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
