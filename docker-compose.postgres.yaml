# Bundled PostgreSQL — in-stack database for the app.
#
# Overlay on docker-compose.yaml, only ever used merged:
#   docker compose -f docker-compose.yaml -f docker-compose.postgres.yaml ...
# The `just prod-up` / `prod-up-colocated` recipes append it BY DEFAULT; set
# `POSTGRES=external` (env or .env) to drop it and point POSTGRES_HOST /
# POSTGRES_PORT in .env at a managed/host PostgreSQL (e.g. a Timeweb managed DB).
#
# When bundled, the DB is reachable by its compose service name, so this overlay
# pins POSTGRES_HOST=postgres for migrate/app/worker/scheduler and adds the
# `depends_on: postgres (healthy)` edge (MERGED into the base definitions, which
# keep their `migrate` ordering). In external mode none of this applies and the
# services read POSTGRES_HOST/POSTGRES_PORT straight from .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: learnic-postgres
    restart: unless-stopped
    init: true
    networks:
      - learnic-net
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  app:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: learnic-postgres-data
